[workspace]
resolver = "3"
members = ["shanghai", "sys", "verinfo", "customlog", "utils", ]
default-members = ["shanghai", "sys", "verinfo", "customlog", "utils"]

[workspace.package]
version = "0.1.0"
authors = ["yappy"]
edition = "2024"
description = "House management system"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
panic = 'abort'

[profile.release]
panic = 'abort'
# Let this true to enable debug symbols in release build
# debug = true

[workspace.dependencies]
# My crates
sys = { path = "./sys" }
verinfo = { path = "./verinfo" }
customlog = { path = "./customlog"}
utils = { path = "./utils" }

static_assertions = "1.1.0"
anyhow = "1.0.104"
thiserror = "2.0.20"
log = { version = "0.4.34", features = ["std"] }
chrono = { version = "0.4.45", features = ["clock", "iana-time-zone", "std"] }
rand = "0.10.2"
regex = "1.13.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.23.0", features = ["json"] }
toml = "1.1.6"

tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "test-util", "macros", "signal", "fs", "process"] }
tokio-stream = "0.1.19"

reqwest = { version = "0.13.5", features = ["json", "multipart", "query"] }

image = "0.25.10"

# For test
serial_test = "4.0.1"
tempfile = "3.27.0"
hex-literal = "1.1.0"
